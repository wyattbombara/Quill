[package]
name = "quill-chat"
version = "0.2.9"
edition = "2024"
rust-version = "1.90"
description = "Local desktop chat for the OpenAI API"

[lib]
name = "quill_chat"
path = "src/lib.rs"
test = false

[[bin]]
name = "quill-chat"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tempfile = "=3.27.0"
zeroize = "=1.9.1"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tauri-plugin-opener = "=2.7.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
tokio = { version = "=1.52.1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
reqwest = { version = "=0.13.5", features = ["json", "form", "stream", "native-tls"], default-features = false }
eventsource-stream = "=0.2.3"
futures-util = "=0.3.32"
rusqlite = { version = "=0.37.0", features = ["bundled-sqlcipher"] }
base64 = "=0.22.1"
ring = "=0.17.14"
jsonwebtoken = { version = "=9.3.1", default-features = false }
uuid = { version = "=1.29.2", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }


